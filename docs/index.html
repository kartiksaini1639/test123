<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0a12">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sadhana">
  <meta name="description" content="Time and track your daily meditation and yoga practice.">
  <title>Sadhana</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="backdrop" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i></div>
  <main id="view" class="view"></main>
  <nav class="tabbar" aria-label="Sections">
    <button data-tab="today" class="active"></button>
    <button data-tab="history"></button>
    <button data-tab="settings"></button>
  </nav>
  <section id="timer" class="sheet" aria-modal="true" role="dialog" hidden></section>
  <div id="modal-root"></div>
  <div id="toast" class="toast" role="status"></div>
  <input id="import-file" type="file" accept="application/json,.json" hidden>
  <script src="app.js"></script>
</body>
</html>
