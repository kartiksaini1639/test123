<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Five-shot music video</title>
<style>
  html,body{margin:0;background:#000;overflow:hidden}
  canvas{display:block;width:100vw;height:auto}
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// Every frame is a pure function of t (seconds). No rAF clock, no Date, seeded randomness only.
const W = 1920, H = 1080;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

// ---------- cut list (from the audio's section boundaries) ----------
const CUTS = { s1: 0, s2: 4.11, s3: 6.9, s4a: 9.47, s4b: 11.12, s5: 12.78, end: 15.2 };
// Onsets measured from the track, used for beat shakes, taps and chomps.
const ONSETS = [0.51,1.09,1.25,1.39,2.41,2.67,2.81,3.04,3.23,4.2,4.67,5.02,5.46,5.85,6.15,6.34,6.55,6.73,
  7.17,7.52,7.92,8.06,8.68,8.82,9.45,10.01,10.31,10.66,10.82,11.01,11.17,11.31,11.45,11.59,12.0,12.54,12.79,
  13.33,13.54,14.14,14.49,14.7];

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeInOut = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const easeOut = k => 1 - Math.pow(1 - k, 3);
const easeIn = k => k * k * k;
const backOut = k => { const c = 1.9; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let x = Math.imul(seed ^ seed >>> 15, 1 | seed);
  x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; }; }
const hash = (n) => { const r = rng(n * 7919 + 13); return r(); };
// sum of decaying kicks: how "hit" the frame is right now
function kick(t, list, decay = 10) { let v = 0; for (const o of list) if (t >= o) v += Math.exp(-(t - o) * decay); return v; }
function lastOnset(t, list) { let o = -1e9; for (const x of list) if (x <= t) o = x; return o; }
function onsetsIn(a, b) { return ONSETS.filter(o => o >= a && o < b); }

function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function ell(x, y, rx, ry, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, Math.abs(rx), Math.abs(ry), rot, 0, Math.PI * 2); }
function fillE(x, y, rx, ry, c, rot = 0) { ell(x, y, rx, ry, rot); ctx.fillStyle = c; ctx.fill(); }
function poly(pts) { ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]); ctx.closePath(); }
function lin(x0, y0, x1, y1, stops) { const g = ctx.createLinearGradient(x0, y0, x1, y1); stops.forEach(([o, c]) => g.addColorStop(o, c)); return g; }
function rad(x, y, r0, r1, stops, x1 = x, y1 = y) { const g = ctx.createRadialGradient(x, y, r0, x1, y1, r1); stops.forEach(([o, c]) => g.addColorStop(o, c)); return g; }
// camera: zoom s around world point (fx,fy) placed at screen (sx,sy)
function cam(s, fx, fy, sx = W / 2, sy = H / 2, rot = 0) { ctx.translate(sx, sy); ctx.rotate(rot); ctx.scale(s, s); ctx.translate(-fx, -fy); }

// ---------- grain (pre-baked, offset per frame index) ----------
const grain = document.createElement('canvas'); grain.width = 512; grain.height = 512;
{ const g = grain.getContext('2d'); const id = g.createImageData(512, 512); const r = rng(42);
  for (let i = 0; i < id.data.length; i += 4) { const v = r() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
  g.putImageData(id, 0, 0); }
function post(t, vign = .55, grainAmt = .07) {
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = rad(W / 2, H / 2, H * .35, H * 1.05, [[0, 'rgba(0,0,0,0)'], [1, `rgba(0,0,0,${vign})`]]);
  ctx.fillRect(0, 0, W, H);
  const f = Math.round(t * 60); const r = rng(f + 1);
  ctx.globalAlpha = grainAmt; ctx.globalCompositeOperation = 'overlay';
  const ox = -r() * 512, oy = -r() * 512;
  for (let x = ox; x < W; x += 512) for (let y = oy; y < H; y += 512) ctx.drawImage(grain, x, y);
  ctx.restore();
}
function flash(t, at, dur = .1, color = '255,255,255', peak = .85) {
  const k = prog(t, at, at + dur); if (t < at || k >= 1) return;
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = `rgba(${color},${peak * (1 - k)})`; ctx.fillRect(0, 0, W, H); ctx.restore();
}

// ====================================================================
// SHOT 1 — a single bottle alone on a cluttered table, dim room. Slow push-in.
// ====================================================================
function shot1(t) {
  const lt = t - CUTS.s1, D = CUTS.s2 - CUTS.s1;
  const k = easeInOut(prog(lt, 0, D));
  ctx.save();
  // push-in drifts slightly downward onto the bottle
  cam(lerp(1.0, 1.75, k), lerp(960, 960, k), lerp(560, 650, k), W / 2, H / 2, lerp(-0.004, 0.006, k));
  // wall
  ctx.fillStyle = lin(0, 0, 0, 760, [[0, '#120e0d'], [.6, '#1f1814'], [1, '#2a1f18']]); ctx.fillRect(-400, -300, 2720, 1100);
  // wainscot lines
  ctx.strokeStyle = 'rgba(255,220,180,0.04)'; ctx.lineWidth = 3;
  for (let x = -380; x < 2400; x += 160) { ctx.beginPath(); ctx.moveTo(x, 420); ctx.lineTo(x, 760); ctx.stroke(); }
  ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(-400, 410, 2720, 14);
  // moonlit window blinds on the wall (cool counter-light)
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 7; i++) {
    const y = 120 + i * 46;
    poly([[180, y], [560, y + 70], [560, y + 92], [180, y + 22]]);
    ctx.fillStyle = `rgba(90,130,200,${0.05 + 0.01 * Math.sin(i)})`; ctx.fill();
  }
  ctx.restore();
  // empty chair silhouettes in the dark
  ctx.fillStyle = '#0d0a09';
  for (const cx of [330, 1600]) { rr(cx - 90, 380, 180, 300, 18); ctx.fill(); ctx.fillRect(cx - 80, 640, 18, 200); ctx.fillRect(cx + 62, 640, 18, 200); }
  // hanging lamp
  ctx.strokeStyle = '#080605'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(960, -300); ctx.lineTo(960, 168); ctx.stroke();
  const flick = 1 + 0.04 * Math.sin(lt * 23) * Math.sin(lt * 7.3) - 0.12 * Math.exp(-Math.abs(lt - 2.67) * 30);
  // light cone
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  poly([[900, 205], [1020, 205], [1330, 860], [590, 860]]);
  ctx.fillStyle = lin(0, 205, 0, 860, [[0, `rgba(255,190,110,${0.22 * flick})`], [1, 'rgba(255,170,90,0.02)']]); ctx.fill();
  ctx.restore();
  poly([[910, 160], [1010, 160], [1060, 215], [860, 215]]); ctx.fillStyle = '#1b1410'; ctx.fill();
  fillE(960, 214, 100, 12, `rgba(255,214,150,${0.95 * flick})`);
  // dust motes inside the cone
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const rd = rng(7);
  for (let i = 0; i < 70; i++) {
    const bx = rd(), by = rd(), sp = .3 + rd(), ph = rd() * 6.28;
    const y = 230 + ((by * 620 + lt * 18 * sp) % 620);
    const half = lerp(60, 370, (y - 205) / 655);
    const x = 960 + (bx * 2 - 1) * half * .9 + Math.sin(lt * sp + ph) * 12;
    ctx.fillStyle = `rgba(255,220,170,${0.35 * (0.5 + 0.5 * Math.sin(lt * 2 * sp + ph))})`;
    ctx.beginPath(); ctx.arc(x, y, 1.6 + rd() * 1.8, 0, 6.28); ctx.fill();
  }
  ctx.restore();
  // table (perspective)
  poly([[160, 740], [1760, 740], [2100, 1080], [-180, 1080]]);
  ctx.fillStyle = lin(0, 740, 0, 1080, [[0, '#2a1a10'], [1, '#160e09']]); ctx.fill();
  ctx.save(); ctx.clip();
  ctx.fillStyle = rad(960, 800, 10, 520, [[0, `rgba(255,170,90,${.42 * flick})`], [1, 'rgba(255,150,80,0)']]); ctx.fillRect(-200, 700, 2400, 400);
  ctx.strokeStyle = 'rgba(0,0,0,.18)'; ctx.lineWidth = 2;
  for (let i = 0; i < 14; i++) { ctx.beginPath(); ctx.moveTo(160 + i * 115, 740); ctx.lineTo(-180 + i * 175, 1080); ctx.stroke(); }
  ctx.restore();
  ctx.fillStyle = '#0e0906'; poly([[-180, 1080], [2100, 1080], [2100, 1110], [-180, 1110]]); ctx.fill();
  // clutter — all of it empty, all of it dim
  const dim = '#1a120d', dim2 = '#24180f', rim = 'rgba(255,190,120,.18)';
  // pizza box
  poly([[230, 800], [560, 790], [600, 860], [200, 875]]); ctx.fillStyle = dim2; ctx.fill(); ctx.strokeStyle = rim; ctx.lineWidth = 2; ctx.stroke();
  // papers
  for (let i = 0; i < 4; i++) { ctx.save(); ctx.translate(1440 + i * 8, 820 - i * 6); ctx.rotate(-.12 + i * .07);
    ctx.fillStyle = i == 3 ? '#4a3c30' : '#2e241c'; ctx.fillRect(-120, -40, 240, 80); ctx.restore(); }
  // crumpled paper balls
  for (const [x, y, r] of [[700, 900, 28], [640, 940, 22], [1250, 960, 30], [1560, 930, 20]]) {
    fillE(x, y, r, r * .8, '#3a2f26'); fillE(x - r * .3, y - r * .3, r * .4, r * .25, 'rgba(255,220,180,.12)'); }
  // tipped empty glasses
  for (const [x, y, rot] of [[420, 960, 1.45], [1360, 880, -1.5]]) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
    poly([[-30, -55], [30, -55], [24, 55], [-24, 55]]); ctx.fillStyle = 'rgba(160,190,200,.08)'; ctx.fill(); ctx.strokeStyle = 'rgba(220,235,240,.25)'; ctx.lineWidth = 3; ctx.stroke();
    ctx.restore(); }
  // empty cans
  for (const [x, y] of [[1150, 815], [780, 800]]) { rr(x - 24, y - 70, 48, 72, 6); ctx.fillStyle = dim; ctx.fill(); ctx.strokeStyle = rim; ctx.stroke(); }
  // ashtray
  fillE(560, 1000, 70, 22, '#120c08'); fillE(560, 996, 56, 15, '#2b211a');
  // bottle shadow
  ctx.save(); ctx.globalCompositeOperation = 'multiply'; fillE(990, 868, 120, 22, 'rgba(0,0,0,.55)'); ctx.restore();
  bottle(960, 865, 1, lt);
  ctx.restore();
  // fade up from black with the music
  const fade = 1 - easeOut(prog(t, 0.45, 1.35));
  if (fade > 0) { ctx.fillStyle = `rgba(0,0,0,${fade})`; ctx.fillRect(0, 0, W, H); }
}
function bottle(x, base, s, lt) {
  ctx.save(); ctx.translate(x, base); ctx.scale(s, s);
  const path = () => { ctx.beginPath(); ctx.moveTo(-58, 0); ctx.lineTo(-58, -230); ctx.bezierCurveTo(-58, -290, -18, -300, -18, -340);
    ctx.lineTo(-18, -420); ctx.lineTo(18, -420); ctx.lineTo(18, -340); ctx.bezierCurveTo(18, -300, 58, -290, 58, -230); ctx.lineTo(58, 0); ctx.closePath(); };
  path(); ctx.fillStyle = lin(-58, 0, 58, 0, [[0, '#0a1a10'], [.35, '#1f4a2c'], [.7, '#123020'], [1, '#06120a']]); ctx.fill();
  // last inch of liquid
  ctx.save(); path(); ctx.clip();
  ctx.fillStyle = lin(0, -40, 0, 0, [[0, 'rgba(255,150,40,.55)'], [1, 'rgba(160,70,10,.7)']]); ctx.fillRect(-60, -38 + Math.sin(lt * 1.3) * 1.5, 120, 40);
  // label
  ctx.fillStyle = '#d9c7a0'; ctx.fillRect(-58, -190, 116, 110);
  ctx.fillStyle = '#6b1d14'; ctx.fillRect(-58, -180, 116, 18); ctx.fillRect(-58, -100, 116, 6);
  ctx.fillStyle = '#2b1b10'; ctx.font = '700 30px "DejaVu Serif"'; ctx.textAlign = 'center'; ctx.fillText('No.1', 0, -122);
  ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = lin(-58, 0, 58, 0, [[0, 'rgba(0,0,0,.6)'], [.4, 'rgba(0,0,0,0)'], [1, 'rgba(0,0,0,.7)']]); ctx.fillRect(-60, -200, 120, 130);
  ctx.restore();
  // glass highlights from the lamp
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = 'rgba(255,220,160,.55)'; rr(-40, -260, 9, 240, 5); ctx.fill();
  ctx.fillStyle = 'rgba(255,220,160,.35)'; rr(-12, -405, 6, 70, 3); ctx.fill();
  ctx.fillStyle = 'rgba(255,200,130,.18)'; rr(34, -240, 6, 200, 3); ctx.fill();
  ctx.restore();
  ctx.fillStyle = '#7a5a20'; rr(-20, -440, 40, 26, 4); ctx.fill();
  ctx.restore();
}

// ====================================================================
// SHOT 2 — cartoon rappers crowding the frame, sound waves blast past a figure who doesn't react.
// Shake on each beat, quick cuts.
// ====================================================================
const RAPPERS = [
  { x: 330, y: 760, s: 1.25, skin: '#8a5a3c', top: '#e8432e', cap: '#1d1d1f', glasses: false, dir: 1, ph: 0 },
  { x: 650, y: 420, s: 0.95, skin: '#d9a77c', top: '#2f6fe0', cap: '#f2c23a', glasses: true, dir: 1, ph: 1.2 },
  { x: 1590, y: 760, s: 1.3, skin: '#5a3726', top: '#20b46a', cap: '#e8432e', glasses: true, dir: -1, ph: 2.1 },
  { x: 1300, y: 400, s: 0.92, skin: '#c58c63', top: '#f2c23a', cap: '#2f6fe0', glasses: false, dir: -1, ph: .6 },
  { x: 960, y: 250, s: 0.8, skin: '#9c6845', top: '#b14ad8', cap: '#20b46a', glasses: true, dir: 1, ph: 3.0 },
];
const FIG = { x: 960, y: 690 };
function shot2(t) {
  const lt = t - CUTS.s2;
  const beats = onsetsIn(CUTS.s2, CUTS.s3);
  // quick cuts: framings change on chosen beats
  const framings = [
    { at: 0.0, s: 1.0, fx: 960, fy: 540, r: 0 },
    { at: 0.56, s: 1.9, fx: 420, fy: 650, r: -.05 },     // left rapper, mouth wide
    { at: 1.35, s: 1.0, fx: 960, fy: 560, r: .03 },      // wide again, tilted
    { at: 1.74, s: 2.3, fx: 960, fy: 640, r: 0 },        // the unbothered face
    { at: 2.23, s: 1.7, fx: 1450, fy: 560, r: .06 },     // right-side pair
  ];
  let f = framings[0]; for (const fr of framings) if (lt >= fr.at) f = fr;
  const since = lt - f.at;
  const hit = kick(t, beats, 14);
  const ang = (lastOnset(t, beats) * 97.3) % 6.28;
  const sx = Math.cos(ang) * 22 * hit + Math.sin(lt * 61) * 4 * hit, sy = Math.sin(ang) * 18 * hit;
  ctx.save();
  ctx.translate(sx, sy);
  cam(f.s * (1 + 0.035 * since) * (1 + 0.02 * hit), f.fx, f.fy, W / 2, H / 2, f.r + 0.012 * hit * Math.sin(ang));
  // background: hot halftone stage
  ctx.fillStyle = rad(960, 600, 50, 1300, [[0, '#ffcf3d'], [.35, '#ff5a36'], [.75, '#7a1fa8'], [1, '#2a0b4a']]); ctx.fillRect(-1000, -800, 3920, 2700);
  // radiating comic rays, rotating slowly
  ctx.save(); ctx.translate(FIG.x, FIG.y - 120); ctx.rotate(lt * .25);
  for (let i = 0; i < 24; i++) { ctx.rotate(Math.PI * 2 / 24); poly([[0, 0], [2400, -110], [2400, 110]]); ctx.fillStyle = i % 2 ? 'rgba(255,255,255,.07)' : 'rgba(0,0,0,.05)'; ctx.fill(); }
  ctx.restore();
  // halftone dots
  ctx.fillStyle = 'rgba(40,0,60,.18)';
  for (let y = -200; y < 1300; y += 34) for (let x = -400; x < 2400; x += 34) {
    const d = Math.hypot(x - 960, y - 560) / 1100; const r = clamp(d, 0, 1) * 9;
    if (r > .6) { ctx.beginPath(); ctx.arc(x + (y / 34 % 2) * 17, y, r, 0, 6.28); ctx.fill(); }
  }
  // sound waves from each mouth, blasting toward and PAST the figure
  for (const R of RAPPERS) {
    const mx = R.x + R.dir * 70 * R.s, my = R.y - 150 * R.s;
    const tx = FIG.x + (FIG.x - mx) * 0.9, ty = FIG.y - 150 + (FIG.y - 150 - my) * 0.9; // aim beyond him
    const a = Math.atan2(ty - my, tx - mx);
    for (let j = 0; j < 6; j++) {
      const ph = ((lt * 2.4 + j / 6 + R.ph) % 1);
      const rr_ = 60 + ph * 1300;
      ctx.save(); ctx.translate(mx, my); ctx.rotate(a);
      ctx.beginPath(); ctx.arc(0, 0, rr_, -0.33, 0.33);
      ctx.strokeStyle = j % 2 ? `rgba(255,255,255,${0.75 * (1 - ph)})` : `rgba(30,10,60,${0.6 * (1 - ph)})`;
      ctx.lineWidth = (14 + 10 * hit) * (1 - ph * .6); ctx.lineCap = 'round'; ctx.stroke();
      ctx.restore();
    }
  }
  // back-row rappers first, front-row last
  for (const i of [4, 1, 3]) rapper(RAPPERS[i], lt, hit);
  figure(FIG.x, FIG.y, lt);
  for (const i of [0, 2]) rapper(RAPPERS[i], lt, hit);
  // speed lines blowing past the figure on hits
  ctx.save(); ctx.globalAlpha = clamp(hit) * .7; ctx.strokeStyle = '#fff'; ctx.lineWidth = 5; ctx.lineCap = 'round';
  const rs = rng(Math.round(lastOnset(t, beats) * 100));
  for (let i = 0; i < 14; i++) { const y = 380 + rs() * 420, side = rs() < .5 ? -1 : 1, x0 = 960 + side * (150 + rs() * 120);
    ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x0 + side * (120 + rs() * 200), y + (rs() - .5) * 30); ctx.stroke(); }
  ctx.restore();
  ctx.restore();
}
function rapper(R, lt, hit) {
  const bob = Math.abs(Math.sin((lt + R.ph) * Math.PI / 0.604)) * 16 + hit * 10;
  const open = 0.65 + 0.35 * Math.abs(Math.sin((lt * 7.5 + R.ph * 3)));
  ctx.save(); ctx.translate(R.x, R.y - bob); ctx.scale(R.s * R.dir, R.s);
  // body / hoodie
  ctx.fillStyle = R.top; ctx.strokeStyle = '#140818'; ctx.lineWidth = 8; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(-150, 360); ctx.bezierCurveTo(-150, 120, -90, 40, 0, 40); ctx.bezierCurveTo(90, 40, 150, 120, 150, 360); ctx.closePath(); ctx.fill(); ctx.stroke();
  // pointing arm toward the figure
  const swing = Math.sin((lt + R.ph) * 9) * .15;
  ctx.save(); ctx.translate(90, 110); ctx.rotate(-0.55 + swing);
  rr(-24, -24, 190, 54, 26); ctx.fill(); ctx.stroke();
  fillE(180, 2, 34, 30, R.skin); ctx.stroke();
  rr(196, -8, 48, 16, 8); ctx.fillStyle = R.skin; ctx.fill(); ctx.stroke();
  ctx.restore();
  // chain
  ctx.strokeStyle = '#ffd34a'; ctx.lineWidth = 10; ctx.beginPath(); ctx.arc(0, 40, 70, .35, Math.PI - .35); ctx.stroke();
  fillE(0, 118, 26, 26, '#ffd34a'); ctx.strokeStyle = '#140818'; ctx.lineWidth = 5; ctx.stroke();
  // head
  ctx.lineWidth = 8;
  fillE(0, -90, 115, 125, R.skin); ctx.stroke();
  // ear
  fillE(-110, -80, 22, 32, R.skin); ctx.stroke();
  // cap (turned around for some)
  ctx.fillStyle = R.cap; ctx.beginPath(); ctx.arc(0, -130, 118, Math.PI * 1.02, Math.PI * 1.98); ctx.closePath(); ctx.fill(); ctx.stroke();
  rr(40, -150, 120, 26, 13); ctx.fill(); ctx.stroke();
  // eyes
  if (R.glasses) { ctx.fillStyle = '#111'; rr(-10, -120, 70, 38, 12); ctx.fill(); rr(66, -120, 46, 38, 12); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.fillRect(2, -114, 18, 6); }
  else { fillE(30, -98, 16, 20, '#fff'); fillE(86, -98, 13, 18, '#fff'); fillE(36, -96, 7, 9, '#111'); fillE(90, -96, 6, 8, '#111');
    ctx.strokeStyle = '#140818'; ctx.lineWidth = 7; ctx.beginPath(); ctx.moveTo(10, -128); ctx.lineTo(50, -118); ctx.moveTo(70, -118); ctx.lineTo(104, -128); ctx.stroke(); }
  // HUGE open mouth
  const mh = 70 * open, mw = 62;
  ctx.save(); ell(62, -20, mw, mh); ctx.fillStyle = '#3a0612'; ctx.fill(); ctx.clip();
  ctx.fillStyle = '#fff'; ctx.fillRect(0, -20 - mh, 130, 20);
  fillE(62, -20 + mh * .8, 40, 26, '#e4566a');
  ctx.restore();
  ell(62, -20, mw, mh); ctx.strokeStyle = '#140818'; ctx.lineWidth = 8; ctx.stroke();
  ctx.restore();
}
function figure(x, y, lt) {
  // The one who doesn't react: small, still, hands in pockets. One slow blink.
  ctx.save(); ctx.translate(x, y);
  ctx.save(); ctx.globalCompositeOperation = 'multiply'; fillE(0, 250, 150, 26, 'rgba(60,0,60,.4)'); ctx.restore();
  ctx.strokeStyle = '#140818'; ctx.lineWidth = 7; ctx.lineJoin = 'round';
  // legs
  ctx.fillStyle = '#2b2d3a'; rr(-58, 120, 50, 130, 14); ctx.fill(); ctx.stroke(); rr(8, 120, 50, 130, 14); ctx.fill(); ctx.stroke();
  fillE(-36, 252, 40, 16, '#eee'); ctx.stroke(); fillE(36, 252, 40, 16, '#eee'); ctx.stroke();
  // hoodie
  ctx.fillStyle = '#8f93a0'; ctx.beginPath(); ctx.moveTo(-95, 150); ctx.bezierCurveTo(-100, 0, -70, -50, 0, -50); ctx.bezierCurveTo(70, -50, 100, 0, 95, 150); ctx.closePath(); ctx.fill(); ctx.stroke();
  rr(-60, 70, 120, 50, 16); ctx.fillStyle = '#7d818e'; ctx.fill(); ctx.stroke();  // pocket with hands in it
  // head with hood up
  fillE(0, -120, 92, 98, '#8f93a0'); ctx.stroke();
  fillE(0, -110, 64, 70, '#c99a74'); ctx.stroke();

  // shelves of bottles, softly lit
  for (let r = 0; r < 2; r++) { ctx.fillStyle = '#3a2210'; ctx.fillRect(0, 150 + r * 170, W, 10);
    for (let i = 0; i < 26; i++) { const x = 30 + i * 74, hgt = 90 + hash(i + r * 40) * 50, c = ['#3d7a4a', '#7a3d2b', '#b88a2e', '#4a5f8a'][(i + r) % 4];
      ctx.fillStyle = c; ctx.globalAlpha = .55; rr(x, 150 + r * 170 - hgt, 34, hgt, 8); ctx.fill(); ctx.globalAlpha = 1; } }
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = rad(960, 300, 20, 900, [[0, 'rgba(255,170,80,.22)'], [1, 'rgba(0,0,0,0)']]); ctx.fillRect(0, 0, W, H); ctx.restore();
  // bartender (torso, behind counter)
  const slideK = easeOut(prog(lt, 0.0, 0.7));
  const bx = 960 - 60 * slideK;
  ctx.save(); ctx.translate(bx, HZ);
  ctx.strokeStyle = '#000'; ctx.lineWidth = 7;
  ctx.fillStyle = '#f0ece4'; rr(-150, -330, 300, 340, 40); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#1c1c22'; poly([[-150, -300], [-40, -300], [-10, 10], [-150, 10]]); ctx.fill(); poly([[150, -300], [40, -300], [10, 10], [150, 10]]); ctx.fill();
  ctx.fillStyle = '#8a1a1a'; poly([[-40, -320], [0, -300], [40, -320], [40, -280], [0, -300], [-40, -280]]); ctx.fill();
  fillE(0, -400, 80, 86, '#c58c63'); ctx.stroke();
  ctx.fillStyle = '#1c1c22'; ctx.beginPath(); ctx.arc(0, -430, 84, Math.PI, 0); ctx.fill();
  ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(-40, -380); ctx.lineTo(-10, -385); ctx.moveTo(10, -385); ctx.lineTo(40, -380); ctx.stroke();  // flat, knowing eyes
  ctx.beginPath(); ctx.moveTo(-50, -350); ctx.quadraticCurveTo(0, -330, 50, -355); ctx.stroke();                                         // moustache-ish smirk
  // arm sliding the receipt
  ctx.fillStyle = '#f0ece4'; ctx.lineWidth = 7;
  ctx.save(); ctx.rotate(.15); rr(60, -150, 80, 180 + 60 * slideK, 30); ctx.fill(); ctx.stroke(); ctx.restore();
  ctx.restore();
  // counter top (perspective)
  poly([[-200, HZ], [W + 200, HZ], [W + 900, H], [-900, H]]);
  ctx.fillStyle = lin(0, HZ, 0, H, [[0, '#4a2510'], [1, '#22100a']]); ctx.fill();
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = rad(960, HZ + 80, 10, 700, [[0, 'rgba(255,180,100,.25)'], [1, 'rgba(0,0,0,0)']]); ctx.fill(); ctx.restore();
  ctx.fillStyle = 'rgba(255,200,140,.25)'; ctx.fillRect(-200, HZ, W + 400, 4);
  // ---- the receipt: unrolls from the bartender's hand toward camera, TOTAL leading ----
  // p = position along the strip (0 = roll at the bartender, 1 = just past the bottom of frame)
  const unroll = lerp(0.06, 1, easeInOut(prog(lt, 0.3, 2.1)));
  const cx = W / 2 - 40 * slideK;
  const yOf = p => HZ + 34 + 640 * Math.pow(p, 1.5);
  const hwOf = p => 64 + (yOf(p) - HZ - 34) * 0.72;
  const PW = 360;
  // paper
  ctx.beginPath(); const NP = 40;
  for (let i = 0; i <= NP; i++) { const p = unroll * i / NP; i ? ctx.lineTo(cx - hwOf(p), yOf(p)) : ctx.moveTo(cx - hwOf(p), yOf(p)); }
  for (let i = NP; i >= 0; i--) { const p = unroll * i / NP; ctx.lineTo(cx + hwOf(p), yOf(p)); }
  ctx.closePath(); ctx.fillStyle = lin(0, HZ, 0, yOf(unroll), [[0, '#d8cfbd'], [1, '#f6f1e6']]); ctx.fill();
  ctx.save(); ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = 'rgba(0,0,0,.12)';
  ctx.fillRect(cx - hwOf(unroll) - 10, yOf(unroll) - 4, 2 * hwOf(unroll) + 20, 12); ctx.restore();
  // printed rows ride with the paper: TOTAL at the leading edge, header trailing near the roll
  const rows = [...ITEMS].reverse().concat([['* YOUR TAB *', '']]);
  rows.forEach(([name, price], i) => {
    const p = unroll - 0.035 - i * 0.068;
    if (p <= 0.004) return;
    const y = yOf(p), hw = hwOf(p), sc = hw / (PW / 2);
    ctx.save(); ctx.setTransform(sc, 0, 0, sc * 0.62, cx - hw, y);
    const total = name === 'TOTAL', head = !price;
    ctx.fillStyle = total ? '#8a1010' : '#2a2622';
    ctx.font = `${total || head ? 900 : 700} ${total ? 36 : 21}px "Courier 10 Pitch", "DejaVu Sans Mono", monospace`;
    if (head) { ctx.textAlign = 'center'; ctx.fillText(name, PW / 2, 0); }
    else { ctx.textAlign = 'left'; ctx.fillText(name, 16, 0); ctx.textAlign = 'right'; ctx.fillText(price, PW - 16, 0); }
    if (total) { ctx.fillRect(16, -46, PW - 32, 4); }
    ctx.restore();
  });
  // the roll still in the bartender's hand
  rr(cx - 80, HZ + 10, 160, 34, 17); ctx.fillStyle = '#e9e2d2'; ctx.fill(); ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 3; ctx.stroke();
  // the wave-off hand, foreground right
  const hk = easeOut(prog(lt, 1.35, 1.75));
  if (hk > 0) {
    const wave = Math.sin((lt - 1.35) * 14) * .32 * clamp((lt - 1.45) / .15);
    ctx.save(); ctx.translate(lerp(W + 300, W - 360, hk), lerp(H + 400, H - 60, hk)); ctx.rotate(-.25 + wave);
    ctx.strokeStyle = '#1a0d06'; ctx.lineWidth = 10; ctx.fillStyle = '#c99a74';
    ctx.fillStyle = '#2a2a33'; rr(-110, 120, 220, 500, 30); ctx.fill(); ctx.stroke();   // sleeve
    ctx.fillStyle = '#c99a74';
    rr(-120, -150, 240, 280, 70); ctx.fill(); ctx.stroke();                              // palm
    for (let f = 0; f < 4; f++) { rr(-110 + f * 58, -330 + Math.abs(f - 1.5) * 26, 50, 220, 25); ctx.fill(); ctx.stroke(); }
    ctx.save(); ctx.rotate(-.7); rr(-250, -40, 160, 56, 28); ctx.fill(); ctx.stroke(); ctx.restore(); // thumb
    ctx.restore();
    // motion arcs
    ctx.save(); ctx.strokeStyle = `rgba(255,240,220,${.5 * Math.abs(Math.cos((lt - 1.35) * 14)) * hk})`; ctx.lineWidth = 8; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(W - 360, H + 60, 560, -2.1, -1.55); ctx.stroke(); ctx.restore();
  }
  ctx.restore();
  // end: cut to black on the last frames
  const out = prog(t, CUTS.end - 0.22, CUTS.end - 0.02);
  if (out > 0) { ctx.fillStyle = `rgba(0,0,0,${easeIn(out)})`; ctx.fillRect(0, 0, W, H); }
}

// ---------- root timeline ----------
function renderAt(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  if (t < CUTS.s2) { shot1(t); post(t, .7, .09); }
  else if (t < CUTS.s3) { shot2(t); post(t, .35, .06); flash(t, CUTS.s2, .07); }
  else if (t < CUTS.s4a) { shot3(t); post(t, .55, .06); }
  else if (t < CUTS.s4b) { shot4a(t); post(t, .5, .07); }
  else if (t < CUTS.s5) { shot4b(t); post(t, .65, .08); flash(t, CUTS.s4b, .06, '120,255,190', .3); }
  else { shot5(t); post(t, .55, .07); }
}
window.renderAt = renderAt;
window.DURATION = CUTS.end;
// preview mode: ?t=3.2 renders a still; ?play plays in real time against the page clock (preview only)
const q = new URLSearchParams(location.search);
if (q.has('t')) renderAt(parseFloat(q.get('t')));
else if (q.has('play')) { const a = new Audio('audio.mp3'); a.play(); (function loop() { renderAt(a.currentTime); requestAnimationFrame(loop); })(); }
else renderAt(0.8);
</script>
