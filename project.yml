name: Sadhana
options:
  bundleIdPrefix: com.kartiksaini
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Sadhana:
    type: application
    platform: iOS
    sources:
      - Sadhana
    info:
      path: Sadhana/Info.plist
      properties:
        CFBundleDisplayName: Sadhana
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSHealthShareUsageDescription: Sadhana reads your Mindful Minutes and yoga workouts to show your daily practice totals.
        NSHealthUpdateUsageDescription: Sadhana saves your meditations as Mindful Minutes and your yoga practice as Yoga workouts in Apple Health.
    entitlements:
      path: Sadhana/Sadhana.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kartiksaini.sadhana
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
